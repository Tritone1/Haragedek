services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grub_stub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - grub_stub_postgres:/var/lib/postgresql/data

volumes:
  grub_stub_postgres:
